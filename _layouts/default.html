<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
